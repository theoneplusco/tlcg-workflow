<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approval Flows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* Tokens: .claude/brand.md (index.html iOS system) */
  :root {
    --blue: #007AFF; --blue-rgb: 0,122,255; --green: #34C759; --orange: #FF9500; --red: #FF3B30; --indigo: #5856D6;
    --bg: #F2F2F7; --card: #FFFFFF; --label: #1C1C1E; --muted: #6B7280;
    --line: rgba(60,60,67,0.14); --line-strong: rgba(60,60,67,0.24); --head: #F7F7FA; --hover: #F0F6FF;
    --font-display: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    --shadow: 0 1px 2px rgba(var(--blue-rgb),.04), 0 8px 24px rgba(var(--blue-rgb),.06);
    --shadow-float: 0 4px 12px rgba(0,0,0,.08), 0 24px 48px rgba(var(--blue-rgb),.14);
    --ease: cubic-bezier(0.16,1,0.3,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--label); font-family: var(--font-body); font-size: 14px; }
  body { overflow-x: hidden; }
  .page { padding: 16px clamp(12px, 2vw, 24px) 110px; max-width: 1400px; margin: 0 auto; }
  a { color: var(--blue); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .kicker { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--blue); display: inline-flex; align-items: center; gap: 8px; }
  .kicker::before { content: ''; width: 18px; height: 2px; background: var(--blue); }
  h1 { font-family: var(--font-display); font-size: 24px; letter-spacing: -0.03em; margin: 2px 0 0; }
  h2 { font-family: var(--font-display); font-size: 16px; letter-spacing: -0.02em; margin: 0 0 10px; }
  .muted { color: var(--muted); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 10px; border: 1px solid transparent;
    background: var(--blue); color: #fff; font: 600 13px var(--font-body); cursor: pointer; text-decoration: none; white-space: nowrap;
    transition: transform .15s var(--ease), box-shadow .15s, opacity .15s; }
  .btn:hover:not(:disabled) { box-shadow: 0 4px 14px rgba(var(--blue-rgb),.25); transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: translateY(0); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn-ghost { background: var(--card); color: var(--label); border-color: var(--line-strong); }
  .btn-ghost:hover:not(:disabled) { box-shadow: 0 4px 12px rgba(0,0,0,.06); }
  .btn-sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
  .icon-btn { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--card); color: var(--label); cursor: pointer; font-size: 12px;
    display: inline-flex; align-items: center; justify-content: center; flex: none; transition: background-color .15s, transform .15s var(--ease); }
  .icon-btn:hover:not(:disabled) { background: var(--hover); }
  .icon-btn:active:not(:disabled) { transform: scale(.94); }
  .icon-btn:disabled { opacity: .3; cursor: default; }
  .btn:focus-visible, .icon-btn:focus-visible, input:focus-visible, select:focus-visible, .co:focus-visible, .tab:focus-visible, .pick button:focus-visible, .chip button:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 2px; }
  .field { height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--card); font: 13px var(--font-body); color: var(--label); }

  .layout { display: grid; grid-template-columns: 280px minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  .card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 14px; }

  /* Company list */
  .cos { display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 220px); overflow: auto; }
  .co { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 10px; border-radius: 10px; border: none; background: none;
    text-align: left; cursor: pointer; font: 13px var(--font-body); color: var(--label); }
  .co:hover { background: var(--hover); }
  .co[aria-current="true"] { background: rgba(var(--blue-rgb),.10); font-weight: 600; }
  .co .txt { flex: 1; min-width: 0; }
  .co .nm { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .co .key { color: var(--muted); font-size: 11px; display: block; }
  .badge { flex: none; font-size: 10px; font-weight: 700; letter-spacing: .04em; padding: 2px 7px; border-radius: 999px; text-transform: uppercase; }
  .b-own { background: rgba(var(--blue-rgb),.12); color: #0057B8; }
  .b-def { background: var(--bg); color: var(--muted); }
  .sep { border: none; border-top: 1px solid var(--line); margin: 6px 4px; }

  /* Flow */
  .status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 12px; background: var(--head); margin-bottom: 14px; font-size: 13px; }
  .status b { font-weight: 600; }
  .flow { display: flex; flex-direction: column; align-items: stretch; }
  .node { align-self: center; padding: 6px 14px; border-radius: 999px; background: var(--head); color: var(--muted); font-size: 12px; font-weight: 600; }
  .arrow { align-self: center; width: 2px; height: 22px; background: var(--line-strong); position: relative; }
  .arrow::after { content: ''; position: absolute; bottom: -1px; left: -4px; border: 5px solid transparent; border-top-color: var(--line-strong); border-bottom: 0; }
  .add-between { align-self: center; margin: -2px 0; opacity: 0; transition: opacity .15s; }
  .flow:hover .add-between, .add-between:focus-visible { opacity: 1; }
  .step { border: 1px solid var(--line-strong); border-radius: 14px; background: var(--card); padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
    transition: box-shadow .2s var(--ease), transform .2s var(--ease); }
  .step:hover { box-shadow: var(--shadow); }
  .step.flash { box-shadow: 0 0 0 3px rgba(var(--blue-rgb),.35); }
  .step-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .num { width: 26px; height: 26px; border-radius: 50%; background: var(--blue); color: #fff; font-weight: 700; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .step-name { flex: 1; min-width: 0; border: 1px solid transparent; border-radius: 8px; padding: 5px 8px; font: 600 14px var(--font-body); color: var(--label); background: transparent; }
  .step-name:hover { border-color: var(--line); }
  .step-name:focus { border-color: var(--blue); outline: none; background: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 10px; border-radius: 10px; background: var(--bg); font-size: 13px; max-width: 100%; }
  .chip .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .role { font-weight: 600; }
  .chip .sub { color: var(--muted); }
  .chip.role-chip { background: rgba(var(--blue-rgb),.08); }
  .chip.empty { background: rgba(255,59,48,.10); color: #B4231A; }
  .chip button { border: none; background: none; color: var(--muted); cursor: pointer; width: 20px; height: 20px; border-radius: 6px; font-size: 14px; line-height: 1; }
  .chip button:hover { background: rgba(0,0,0,.08); color: var(--red); }
  .all { font-size: 11px; font-weight: 700; color: var(--indigo); background: rgba(88,86,214,.10); padding: 3px 8px; border-radius: 999px; }
  .empty-flow { text-align: center; padding: 28px; color: var(--muted); border: 2px dashed var(--line-strong); border-radius: 14px; }

  /* Picker */
  .picker { position: absolute; z-index: 60; width: 340px; max-height: 420px; display: flex; flex-direction: column; background: var(--card); border-radius: 14px;
    box-shadow: var(--shadow-float); padding: 10px; }
  .picker[hidden] { display: none; }
  .tabs { display: flex; gap: 4px; padding: 3px; background: var(--bg); border-radius: 10px; margin-bottom: 8px; }
  .tab { flex: 1; height: 28px; border: none; border-radius: 8px; background: none; font: 600 12px var(--font-body); color: var(--muted); cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--card); color: var(--label); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .pick { overflow: auto; margin-top: 8px; display: flex; flex-direction: column; gap: 2px; }
  .pick button { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; border: none; background: none; text-align: left; padding: 7px 9px; border-radius: 8px;
    font: 13px var(--font-body); color: var(--label); cursor: pointer; }
  .pick button:hover:not(:disabled) { background: var(--hover); }
  .pick button:disabled { color: var(--muted); cursor: default; }
  .pick small { color: var(--muted); font-size: 11px; }
  .pick small.warn { color: #B4231A; }

  /* Side panels */
  .who-list { display: flex; flex-direction: column; gap: 10px; max-height: 46vh; overflow: auto; }
  .who-co { border: 1px solid var(--line); border-radius: 12px; padding: 10px; font-size: 12px; }
  .who-co b { display: block; font-size: 13px; margin-bottom: 4px; }
  .who-co ol { margin: 0; padding-left: 18px; line-height: 1.6; }
  .who-co .bad { color: #B4231A; margin-top: 4px; }
  .versions { display: flex; flex-direction: column; gap: 6px; max-height: 30vh; overflow: auto; }
  .ver { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
  .ver b { font-size: 13px; }
  .ver .note { grid-column: 1 / -1; color: var(--muted); }
  .tag-now { font-size: 10px; font-weight: 700; color: #1E7A36; background: rgba(52,199,89,.15); padding: 2px 6px; border-radius: 999px; margin-left: 4px; }
  .tag-future { font-size: 10px; font-weight: 700; color: #8A4B00; background: rgba(255,149,0,.16); padding: 2px 6px; border-radius: 999px; margin-left: 4px; }

  /* Save bar + dialogs */
  .savebar { position: fixed; left: 50%; bottom: 20px; z-index: 45; transform: translate(-50%, 140%); opacity: 0; display: flex; align-items: center; gap: 10px;
    padding: 10px 10px 10px 18px; border-radius: 16px; background: var(--label); color: #fff; box-shadow: var(--shadow-float);
    transition: transform .35s var(--ease), opacity .25s; max-width: calc(100vw - 24px); }
  .savebar.show { transform: translate(-50%, 0); opacity: 1; }
  .savebar .dot { width: 8px; height: 8px; border-radius: 50%; background: #FFB020; }
  .savebar .btn-ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.3); }
  #message { display: none; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 12px; margin-bottom: 12px; }
  #message.ok, #message.err { display: flex; }
  #message.ok { background: rgba(52,199,89,.14); color: #1E7A36; }
  #message.err { background: rgba(255,59,48,.12); color: #B4231A; }
  #message .x { margin-left: auto; border: none; background: none; cursor: pointer; color: inherit; font-size: 16px; }
  dialog { border: none; border-radius: 18px; padding: 0; width: min(760px, calc(100vw - 24px)); box-shadow: 0 24px 64px rgba(0,0,0,.22); color: var(--label); }
  dialog::backdrop { background: rgba(0,0,0,.32); }
  dialog form { padding: 22px; }
  dialog h3 { font-family: var(--font-display); font-size: 18px; letter-spacing: -0.02em; margin: 0 0 12px; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .compare > div { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
  .compare h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .compare ol { margin: 0; padding-left: 18px; line-height: 1.7; }
  .compare .new { background: rgba(var(--blue-rgb),.04); border-color: rgba(var(--blue-rgb),.3); }
  .form-row { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }
  .form-row label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .warn-box { background: rgba(255,149,0,.12); color: #8A4B00; border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .center { text-align: center; padding: 56px 16px; color: var(--muted); }

  @media (max-width: 1100px) { .layout { grid-template-columns: 240px minmax(0, 1fr); } .side { grid-column: 1 / -1; } }
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; }
    .cos { flex-direction: row; overflow-x: auto; max-height: none; }
    .co { flex: none; }
    .compare, .form-row { grid-template-columns: 1fr; }
    .picker { width: calc(100vw - 24px); }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
<script src="i18n.js"></script>
    <link rel="stylesheet" href="app-sidebar.css?v=20261009-1">
    <script src="app-sidebar.js?v=20261009-2" data-active="admin-flows" defer></script>
</head>
<body>
<div class="page">
  <div class="top">
    <div style="display:flex; align-items:center; gap:12px;">
    <button type="button" class="asb-burger" data-asb-open aria-label="Mở menu" data-i18n-aria="openMenu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div>
      <span class="kicker">TLCG Workflow</span>
      <h1>Approval Flows</h1>
    </div>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <select class="field" id="workflow" aria-label="Workflow"></select>
      <a class="btn btn-ghost" href="admin.html" id="to-master">Master Data</a>
      <a class="btn btn-ghost" href="index.html" id="to-app">← Back to app</a>
    </div>
  </div>
  <div id="message" role="status"></div>
  <div id="app"><div class="center">Loading…</div></div>
</div>

<div class="picker" id="picker" hidden role="dialog" aria-label="Add an approver">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-ptab="role" aria-selected="true" type="button">Role in the company</button>
    <button class="tab" role="tab" data-ptab="person" aria-selected="false" type="button">Specific person</button>
  </div>
  <input class="field" id="picker-search" placeholder="Search…" aria-label="Search">
  <div class="pick" id="picker-list"></div>
</div>

<div class="savebar" id="savebar" role="region" aria-label="Unsaved flow">
  <span class="dot"></span><span>Unsaved changes to this flow</span>
  <button class="btn btn-ghost btn-sm" id="discard" type="button">Discard</button>
  <button class="btn btn-sm" id="review" type="button">Review &amp; save</button>
</div>

<dialog id="save-dialog">
  <form method="dialog" id="save-form">
    <h3 id="save-title">Save a new version</h3>
    <div id="save-warn"></div>
    <div class="compare">
      <div><h4 id="cmp-old-title">In force now</h4><ol id="cmp-old"></ol></div>
      <div class="new"><h4 id="cmp-new-title">New version</h4><ol id="cmp-new"></ol></div>
    </div>
    <div class="form-row">
      <label>Takes effect
        <select class="field" id="eff-mode"><option value="now">Immediately</option><option value="date">On a date…</option></select>
        <input class="field" type="datetime-local" id="eff-date" hidden>
      </label>
      <label>Note (why it changed)
        <input class="field" id="note" maxlength="500" placeholder="e.g. Director approves before the Legal Representative">
      </label>
    </div>
    <p class="muted" style="font-size:12px; margin:12px 0 0;">Vouchers already submitted keep the flow they started with. Earlier versions stay in the history.</p>
    <div class="actions">
      <button class="btn btn-ghost" type="button" id="save-cancel">Cancel</button>
      <button class="btn" type="submit" id="save-confirm">Save version</button>
    </div>
  </form>
</dialog>

<dialog id="ask" style="width:min(460px, calc(100vw - 24px));">
  <form method="dialog" id="ask-form">
    <h3 id="ask-title"></h3>
    <p id="ask-body" style="margin:0; line-height:1.6;"></p>
    <div class="actions">
      <button class="btn btn-ghost" type="button" id="ask-cancel">Cancel</button>
      <button class="btn" type="submit" id="ask-ok">OK</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  'use strict';

  const app = document.getElementById('app');
  const messageEl = document.getElementById('message');
  const state = {
    workflow: 'voucher', companyId: null, data: null,
    draft: null,          // steps being edited; null = showing the flow in force
    pickerStep: null,
  };

  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtDate = (d) => d ? new Date(d).toLocaleString('vi-VN', { dateStyle: 'short', timeStyle: 'short' }) : '';
  const clone = (x) => JSON.parse(JSON.stringify(x));

  function currentUser() {
    try { return JSON.parse(localStorage.getItem('tlc_current_user') || 'null'); } catch (e) { return null; }
  }
  function showMessage(ok, html) {
    messageEl.className = ok ? 'ok' : 'err';
    messageEl.innerHTML = '<span>' + html + '</span><button class="x" aria-label="Dismiss">×</button>';
    messageEl.querySelector('.x').onclick = () => { messageEl.className = ''; };
  }
  async function api(action, body) {
    const user = currentUser();
    const res = await fetch('/api/voucher', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ((user && user.token) || '') },
      body: JSON.stringify(Object.assign({ action: action }, body || {}))
    });
    let json;
    try { json = await res.json(); } catch (e) { throw new Error('Server returned HTTP ' + res.status); }
    if (!json.success) { const err = new Error(json.message || 'Request failed'); err.status = res.status; throw err; }
    return json;
  }
  function gate(text, withSignIn) {
    app.innerHTML = '<div class="card center"><p>' + text + '</p>' +
      (withSignIn ? '<button class="btn" id="signin-again">Sign in again</button>' : '<a class="btn btn-ghost" href="index.html">Back to the app</a>') + '</div>';
    const b = document.getElementById('signin-again');
    if (b) b.onclick = () => { try { localStorage.removeItem('tlc_current_user'); } catch (e) {} location.href = 'index.html'; };
  }
  function ask(title, body, okText) {
    return new Promise((resolve) => {
      const d = document.getElementById('ask');
      document.getElementById('ask-title').textContent = title;
      document.getElementById('ask-body').innerHTML = body;
      document.getElementById('ask-ok').textContent = okText || 'OK';
      const done = (v) => { d.close(); resolve(v); };
      document.getElementById('ask-cancel').onclick = () => done(false);
      document.getElementById('ask-form').onsubmit = (e) => { e.preventDefault(); done(true); };
      d.oncancel = (e) => { e.preventDefault(); done(false); };
      d.showModal();
      document.getElementById('ask-ok').focus();
    });
  }

  // ── Helpers over the loaded data ─────────────────────────────

  const roleInfo = (key) => state.data.roles.find((r) => r.role === key) || { role: key, label: key, name: '', email: '' };
  const personInfo = (email) => state.data.employees.find((e) => e.email === String(email).toLowerCase());
  const isDefault = () => state.companyId == null;
  const selectedCompany = () => state.data.companies.find((c) => c.id === state.companyId);
  const steps = () => state.draft || state.data.active.steps;
  const dirty = () => state.draft != null;

  /** "Kế toán trưởng (Nguyễn Thị Nhanh)" / "Nguyễn Văn A" — plain text for summaries. */
  function approverText(a) {
    if (a.type === 'role') {
      const r = roleInfo(a.role);
      return isDefault() ? r.label : r.label + ' (' + (r.name || 'nobody') + ')';
    }
    const p = personInfo(a.email);
    return p ? p.name : a.email;
  }

  // ── Render ───────────────────────────────────────────────────

  function renderShell() {
    const d = state.data;
    const wf = document.getElementById('workflow');
    wf.innerHTML = d.workflows.map((w) => '<option value="' + w.key + '"' + (w.enabled ? '' : ' disabled') + '>' + esc(w.label) + (w.enabled ? '' : ' — soon') + '</option>').join('');
    wf.value = state.workflow;

    const co = (id, name, sub, badge, cls) => '<button class="co" type="button" data-co="' + (id == null ? '' : id) + '" aria-current="' + (id === state.companyId) + '">' +
      '<span class="txt"><span class="nm" title="' + esc(name) + '">' + esc(name) + '</span>' + (sub ? '<span class="key">' + esc(sub) + '</span>' : '') + '</span>' +
      (badge ? '<span class="badge ' + cls + '">' + badge + '</span>' : '') + '</button>';
    app.innerHTML =
      '<div class="layout">' +
        '<nav class="card" aria-label="Companies"><h2>Companies</h2><div class="cos">' +
          co(null, 'Default flow', 'Used by every company without its own') + '<hr class="sep">' +
          d.companies.map((c) => co(c.id, c.name, c.key, c.hasOwn ? 'Own' : 'Default', c.hasOwn ? 'b-own' : 'b-def')).join('') +
        '</div></nav>' +
        '<main class="card" id="editor"></main>' +
        '<aside class="side" style="display:flex; flex-direction:column; gap:16px;">' +
          '<section class="card"><h2 id="who-title">Who will approve</h2><div class="who-list" id="who"></div></section>' +
          '<section class="card"><h2>Version history</h2><div class="versions" id="versions"></div></section>' +
        '</aside>' +
      '</div>';
    app.querySelectorAll('[data-co]').forEach((b) => b.addEventListener('click', () => switchCompany(b.dataset.co === '' ? null : Number(b.dataset.co))));
    renderEditor();
    renderSide();
  }

  function renderEditor() {
    const d = state.data;
    const ed = document.getElementById('editor');
    const a = d.active;
    const c = selectedCompany();
    const usesDefault = !isDefault() && a.source !== 'company';
    let status;
    if (dirty()) status = '<span>✎ <b>Editing a new version</b> — not saved yet.</span>';
    else if (a.source === 'builtin') status = '<span>Using the <b>built-in flow</b> (nothing saved yet).</span>';
    else if (usesDefault) status = '<span>This company follows the <b>default flow</b> (v' + a.version + ').</span>';
    else status = '<span>In force: <b>version ' + a.version + '</b> · saved ' + esc(fmtDate(a.createdAt)) + ' by ' + esc(a.createdBy) + (a.note ? ' · “' + esc(a.note) + '”' : '') + '</span>';

    const list = steps();
    const readOnly = usesDefault && !dirty();
    ed.innerHTML =
      '<h2>' + (isDefault() ? 'Default flow — all companies without their own' : esc(c.name) + (c.key ? ' <span class="muted">(' + esc(c.key) + ')</span>' : '')) + '</h2>' +
      '<div class="status">' + status +
        (readOnly ? '<button class="btn btn-sm" id="make-own" type="button">Create a flow for this company</button>' : '') + '</div>' +
      '<div class="flow" id="flow">' +
        '<span class="node">Submitter sends the voucher</span>' +
        (list.length ? list.map((s, i) => stepHtml(s, i, list.length, readOnly)).join('') : '<div class="arrow"></div><div class="empty-flow">No steps — add the first one.</div>') +
        '<div class="arrow"></div>' +
        (readOnly ? '' : '<button class="btn btn-ghost" type="button" data-add-step="' + list.length + '" style="align-self:center;">+ Add a step</button><div class="arrow"></div>') +
        '<span class="node">Approved → treasurer pays / receives</span>' +
      '</div>';

    const mk = document.getElementById('make-own');
    if (mk) mk.onclick = () => startDraft(clone(d.active.steps));
    updateSavebar();
    if (document.getElementById('who')) schedulePreview();
  }

  function stepHtml(s, i, total, readOnly) {
    const chips = s.approvers.map((a, k) => {
      if (a.type === 'role') {
        const r = roleInfo(a.role);
        const empty = !isDefault() && !r.email;
        return '<span class="chip role-chip' + (empty ? ' empty' : '') + '" title="' + (empty ? 'This company has nobody in this role — fill it in Master Data › Companies' : 'Follows whoever holds this role') + '">' +
          '<span class="who"><span class="role">' + esc(r.label) + '</span>' + (isDefault() ? '' : ' <span class="sub">· ' + esc(r.name || 'nobody') + '</span>') + '</span>' +
          (readOnly ? '' : '<button type="button" data-rm="' + i + ':' + k + '" aria-label="Remove ' + esc(r.label) + '">×</button>') + '</span>';
      }
      const p = personInfo(a.email);
      return '<span class="chip" title="' + esc(a.email) + '"><span class="who">👤 ' + esc(p ? p.name : a.email) + (p && p.position ? ' <span class="sub">· ' + esc(p.position) + '</span>' : '') + '</span>' +
        (readOnly ? '' : '<button type="button" data-rm="' + i + ':' + k + '" aria-label="Remove ' + esc(p ? p.name : a.email) + '">×</button>') + '</span>';
    }).join('');
    return '<div class="arrow"></div>' +
      (readOnly ? '' : '<button class="btn btn-ghost btn-sm add-between" type="button" data-add-step="' + i + '" aria-label="Insert a step before step ' + (i + 1) + '">+ Insert step here</button><div class="arrow"></div>') +
      '<div class="step" data-step="' + i + '">' +
        '<div class="step-head"><span class="num">' + (i + 1) + '</span>' +
          (readOnly ? '<span class="step-name">' + esc(s.name) + '</span>'
                    : '<input class="step-name" data-name="' + i + '" value="' + esc(s.name) + '" aria-label="Step ' + (i + 1) + ' name" maxlength="80">') +
          (s.approvers.length > 1 ? '<span class="all" title="Every approver in this step must approve">All must approve</span>' : '') +
          (readOnly ? '' :
            '<button class="icon-btn" type="button" data-up="' + i + '" aria-label="Move step up"' + (i === 0 ? ' disabled' : '') + '>▲</button>' +
            '<button class="icon-btn" type="button" data-down="' + i + '" aria-label="Move step down"' + (i === total - 1 ? ' disabled' : '') + '>▼</button>' +
            '<button class="icon-btn" type="button" data-del="' + i + '" aria-label="Delete step" title="Delete step">🗑</button>') +
        '</div>' +
        '<div class="chips">' + (chips || '<span class="muted" style="font-size:13px;">No approver yet</span>') +
          (readOnly ? '' : '<button class="btn btn-ghost btn-sm" type="button" data-pick="' + i + '">+ Approver</button>') + '</div>' +
      '</div>';
  }

  function renderCoverage(list) {
    document.getElementById('who-title').textContent = dirty() ? 'Who will approve (preview)' : 'Who will approve';
    document.getElementById('who').innerHTML = (list || []).map((c) =>
      '<div class="who-co"><b>' + esc(c.company) + '</b><ol>' + c.people.map((p) => '<li>' + p.map(esc).join(' + ') + '</li>').join('') + '</ol>' +
      (c.problems.length ? '<div class="bad">⚠ ' + c.problems.map(esc).join('<br>⚠ ') + '</div>' : '') + '</div>').join('') ||
      '<p class="muted">No company uses this flow.</p>';
  }

  // Live preview of the draft (debounced); falls back to the saved flow's coverage
  let previewTimer = 0, previewSeq = 0;
  function schedulePreview() {
    clearTimeout(previewTimer);
    if (!dirty()) { renderCoverage(state.data.coverage); return; }
    previewTimer = setTimeout(async () => {
      const seq = ++previewSeq;
      try {
        const res = await api('adminApprovalFlowPreview', { workflow: state.workflow, companyId: state.companyId, steps: state.draft });
        if (seq === previewSeq && dirty()) renderCoverage(res.data.coverage);
      } catch (e) { /* preview is best effort */ }
    }, 250);
  }

  function renderSide() {
    const d = state.data;
    renderCoverage(d.coverage);
    const now = Date.now();
    document.getElementById('versions').innerHTML = d.versions.length ? d.versions.map((v) => {
      const future = new Date(v.effectiveFrom).getTime() > now;
      const inForce = d.active.id === v.id;
      return '<div class="ver"><span><b>v' + v.version + '</b>' + (inForce ? '<span class="tag-now">IN FORCE</span>' : '') + (future ? '<span class="tag-future">FROM ' + esc(fmtDate(v.effectiveFrom)) + '</span>' : '') +
        '<br><span class="muted">' + esc(fmtDate(v.createdAt)) + ' · ' + esc(v.createdBy) + '</span></span>' +
        '<button class="btn btn-ghost btn-sm" type="button" data-restore="' + v.id + '">Edit from this</button>' +
        (v.note ? '<span class="note">“' + esc(v.note) + '”</span>' : '') + '</div>';
    }).join('') : '<p class="muted">No versions saved yet.</p>';
  }

  // ── Editing (all local until Save) ───────────────────────────

  function startDraft(stepsList) {
    state.draft = stepsList;
    renderEditor();
  }
  function edit(fn) {
    if (!state.draft) state.draft = clone(state.data.active.steps);
    fn(state.draft);
    renderEditor();
  }
  function flashStep(i) {
    const el = document.querySelector('.step[data-step="' + i + '"]');
    if (!el) return;
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 700);
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('button');
    if (!t || !t.dataset) return;
    if (t.dataset.addStep != null) {
      const at = Number(t.dataset.addStep);
      edit((s) => s.splice(at, 0, { name: 'Bước ' + (at + 1), approvers: [] }));
      flashStep(at);
      const inp = document.querySelector('[data-name="' + at + '"]');
      if (inp) { inp.focus(); inp.select(); }
    } else if (t.dataset.up != null) {
      const i = Number(t.dataset.up);
      edit((s) => s.splice(i - 1, 0, s.splice(i, 1)[0]));
      flashStep(i - 1);
    } else if (t.dataset.down != null) {
      const i = Number(t.dataset.down);
      edit((s) => s.splice(i + 1, 0, s.splice(i, 1)[0]));
      flashStep(i + 1);
    } else if (t.dataset.del != null) {
      const i = Number(t.dataset.del);
      edit((s) => s.splice(i, 1));
    } else if (t.dataset.rm != null) {
      const [i, k] = t.dataset.rm.split(':').map(Number);
      edit((s) => s[i].approvers.splice(k, 1));
    } else if (t.dataset.pick != null) {
      openPicker(Number(t.dataset.pick), t);
    } else if (t.dataset.restore != null) {
      const v = state.data.versions.find((x) => String(x.id) === t.dataset.restore);
      if (v) { startDraft(clone(v.steps)); showMessage(true, 'Loaded version ' + v.version + ' into the editor — change it, then Review &amp; save.'); }
    }
  });
  document.addEventListener('input', (e) => {
    const n = e.target.dataset && e.target.dataset.name;
    if (n == null) return;
    if (!state.draft) state.draft = clone(state.data.active.steps);
    state.draft[Number(n)].name = e.target.value;
    updateSavebar();
  });

  // ── Approver picker ──────────────────────────────────────────

  const picker = document.getElementById('picker');
  let pickerTab = 'role';
  function openPicker(stepIndex, anchor) {
    state.pickerStep = stepIndex;
    picker.hidden = false;
    const r = anchor.getBoundingClientRect();
    const w = picker.offsetWidth;
    picker.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left)) + window.scrollX + 'px';
    picker.style.top = r.bottom + 6 + window.scrollY + 'px';
    document.getElementById('picker-search').value = '';
    renderPicker();
    document.getElementById('picker-search').focus();
  }
  function closePicker() { picker.hidden = true; state.pickerStep = null; }
  function renderPicker() {
    picker.querySelectorAll('[data-ptab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.ptab === pickerTab)));
    const q = document.getElementById('picker-search').value.trim().toLowerCase();
    const current = steps()[state.pickerStep].approvers;
    const has = (a) => current.some((x) => x.type === a.type && (a.type === 'role' ? x.role === a.role : x.email === a.email));
    let html;
    if (pickerTab === 'role') {
      html = state.data.roles.filter((r) => !q || (r.label + ' ' + r.name).toLowerCase().includes(q)).map((r) => {
        const taken = has({ type: 'role', role: r.role });
        const sub = isDefault() ? 'Resolved per company' : (r.email ? 'Today: ' + r.name : 'Nobody in this company');
        return '<button type="button" data-add-role="' + r.role + '"' + (taken ? ' disabled' : '') + '>' + esc(r.label) +
          '<small' + (!isDefault() && !r.email ? ' class="warn"' : '') + '>' + esc(taken ? 'Already in this step' : sub) + '</small></button>';
      }).join('');
    } else {
      html = state.data.employees.filter((p) => !q || (p.name + ' ' + p.email + ' ' + (p.position || '')).toLowerCase().includes(q)).map((p) => {
        const taken = has({ type: 'person', email: p.email });
        return '<button type="button" data-add-person="' + esc(p.email) + '"' + (taken ? ' disabled' : '') + '>' + esc(p.name) +
          '<small>' + esc(taken ? 'Already in this step' : (p.position ? p.position + ' · ' : '') + p.email) + '</small></button>';
      }).join('');
    }
    document.getElementById('picker-list').innerHTML = html || '<p class="muted" style="padding:8px;">Nothing matches.</p>';
  }
  picker.addEventListener('click', (e) => {
    const tab = e.target.closest('[data-ptab]');
    if (tab) { pickerTab = tab.dataset.ptab; renderPicker(); return; }
    const role = e.target.closest('[data-add-role]');
    const person = e.target.closest('[data-add-person]');
    if (!role && !person) return;
    const i = state.pickerStep;
    edit((s) => s[i].approvers.push(role ? { type: 'role', role: role.dataset.addRole } : { type: 'person', email: person.dataset.addPerson }));
    closePicker();
    flashStep(i);
  });
  document.getElementById('picker-search').addEventListener('input', renderPicker);
  document.addEventListener('mousedown', (e) => { if (!picker.hidden && !picker.contains(e.target) && !e.target.closest('[data-pick]')) closePicker(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !picker.hidden) { closePicker(); } });

  // ── Save (review → confirm) ──────────────────────────────────

  const savebar = document.getElementById('savebar');
  function updateSavebar() { savebar.classList.toggle('show', dirty()); }

  /** Same checks as the server (api/lib/approval/engine.js validateSteps), for instant feedback. */
  function draftErrors(list) {
    if (!list.length) return ['Add at least one step.'];
    return list.flatMap((s, i) => (s.approvers.length ? [] : ['Step ' + (i + 1) + ' (' + (s.name || '') + ') has no approver.']));
  }

  document.getElementById('discard').onclick = async () => {
    if (!(await ask('Discard your changes?', 'The flow goes back to the version in force. Nothing is saved.', 'Discard'))) return;
    state.draft = null;
    renderEditor();
  };

  const saveDialog = document.getElementById('save-dialog');
  document.getElementById('review').onclick = () => {
    const list = state.draft.map((s, i) => Object.assign({}, s, { name: (s.name || '').trim() || 'Bước ' + (i + 1) }));
    const errors = draftErrors(list);
    if (errors.length) { showMessage(false, errors.map(esc).join('<br>')); return; }
    const c = selectedCompany();
    const nextVersion = (state.data.versions[0] ? state.data.versions[0].version : 0) + 1;
    document.getElementById('save-title').textContent = 'Save version ' + nextVersion + ' — ' + (isDefault() ? 'default flow' : c.name);
    const ol = (arr) => arr.map((s) => '<li><b>' + esc(s.name) + '</b>: ' + s.approvers.map((a) => esc(approverText(a))).join(' + ') +
      (s.approvers.length > 1 ? ' <span class="muted">(all)</span>' : '') + '</li>').join('');
    document.getElementById('cmp-old-title').textContent = state.data.active.source === 'builtin' ? 'Built-in today' : (state.data.active.source === 'default' && !isDefault() ? 'Default flow today' : 'In force now (v' + state.data.active.version + ')');
    document.getElementById('cmp-old').innerHTML = ol(state.data.active.steps);
    document.getElementById('cmp-new').innerHTML = ol(list);
    const empty = isDefault() ? [] : list.flatMap((s, i) => s.approvers.filter((a) => a.type === 'role' && !roleInfo(a.role).email)
      .map((a) => 'Step ' + (i + 1) + ': this company has no ' + roleInfo(a.role).label + ' — vouchers cannot be submitted until Master Data fills it.'));
    document.getElementById('save-warn').innerHTML = empty.length ? '<div class="warn-box">⚠ ' + empty.map(esc).join('<br>⚠ ') + '</div>' : '';
    document.getElementById('eff-mode').value = 'now';
    document.getElementById('eff-date').hidden = true;
    document.getElementById('note').value = '';
    saveDialog.showModal();
    document.getElementById('note').focus();
    state.pendingSave = list;
  };
  document.getElementById('eff-mode').onchange = (e) => {
    const d = document.getElementById('eff-date');
    d.hidden = e.target.value !== 'date';
    if (!d.hidden && !d.value) {
      const t = new Date(Date.now() + 86400000); t.setHours(0, 0, 0, 0);
      d.value = new Date(t.getTime() - t.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    }
  };
  document.getElementById('save-cancel').onclick = () => saveDialog.close();
  document.getElementById('save-form').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('save-confirm');
    const mode = document.getElementById('eff-mode').value;
    const dateVal = document.getElementById('eff-date').value;
    if (mode === 'date' && !dateVal) return;
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      const res = await api('adminApprovalFlowSave', {
        workflow: state.workflow, companyId: state.companyId, steps: state.pendingSave,
        effectiveFrom: mode === 'date' ? new Date(dateVal).toISOString() : null,
        note: document.getElementById('note').value.trim()
      });
      saveDialog.close();
      state.draft = null;
      showMessage(true, esc(res.message) + (mode === 'date' ? ' It takes effect ' + esc(fmtDate(res.data.effectiveFrom)) + '.' : ' It is in force now.'));
      await load(state.companyId);
    } catch (err) {
      if (err.status === 401) { saveDialog.close(); return gate(esc(err.message), true); }
      showMessage(false, esc(err.message));
      saveDialog.close();
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save version';
    }
  };

  // ── Navigation guards + load ─────────────────────────────────

  async function leaveDraft() {
    if (!dirty()) return true;
    if (!(await ask('Leave without saving?', 'Your changes to this flow are not saved yet.', 'Discard changes'))) return false;
    state.draft = null;
    return true;
  }
  async function switchCompany(id) {
    if (id === state.companyId) return;
    if (!(await leaveDraft())) return;
    await load(id);
  }
  document.getElementById('workflow').onchange = async (e) => {
    if (!(await leaveDraft())) { e.target.value = state.workflow; return; }
    state.workflow = e.target.value;
    load(null);
  };
  ['to-master', 'to-app'].forEach((id) => document.getElementById(id).addEventListener('click', async (e) => {
    if (!dirty()) return;
    e.preventDefault();
    if (await leaveDraft()) location.href = e.currentTarget.href;
  }));
  window.addEventListener('beforeunload', (e) => { if (dirty()) { e.preventDefault(); e.returnValue = ''; } });

  async function load(companyId) {
    const user = currentUser();
    if (!user) return gate('Please sign in first.', true);
    if (!user.isAdmin) return gate('Approval flows can only be changed by administrators.', false);
    if (!user.token) return gate('Your session is from before the admin tools existed.', true);
    try {
      const res = await api('adminApprovalFlowGet', { workflow: state.workflow, companyId: companyId });
      state.data = res.data;
      state.companyId = companyId;
      state.draft = null;
      renderShell();
    } catch (err) {
      if (err.status === 401) return gate(esc(err.message), true);
      if (err.status === 403) return gate(esc(err.message), false);
      gate('Could not load: ' + esc(err.message), false);
    }
  }
  load(null);
})();
</script>
</body>
</html>
