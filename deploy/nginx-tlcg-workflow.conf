# Retired 2026-10-10: for the old workflow.tl-c.us app on Ubuntu. The live system is wf.tl-c.us (Mac Mini).
# nginx site for TLCG Workflow.
#
#   sudo cp deploy/nginx-tlcg-workflow.conf /etc/nginx/sites-available/tlcg-workflow
#   sudo ln -s /etc/nginx/sites-available/tlcg-workflow /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d workflow.tl-c.us

server {
    listen 80;
    server_name workflow.tl-c.us;
    # certbot rewrites this block to redirect to 443.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # Cloudflare fronts this host: prefer CF-Connecting-IP so the app's
        # per-IP rate limit sees the real visitor, not Cloudflare's edge.
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;

        # api/voucher.js declares a 10mb body limit; allow headroom.
        client_max_body_size 12M;

        # Apps Script can be slow — do not cut requests short.
        proxy_connect_timeout 30s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/tlcg-workflow.access.log;
    error_log  /var/log/nginx/tlcg-workflow.error.log;
}
